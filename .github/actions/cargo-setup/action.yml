name: Cargo Setup
description: Checks out the repository, caches Cargo dependencies, and installs CI tools on bare runners

inputs:
  container-image:
    description: Container image the job is running in (empty = bare runner)
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Check out repository
      uses: actions/checkout@v6
    # CARGO_HOME may differ inside containers vs standard runners
    - name: Resolve Cargo home
      id: cargo-home
      run: echo "path=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache Cargo dependencies
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.cargo-home.outputs.path }}/registry/index/
          ${{ steps.cargo-home.outputs.path }}/registry/cache/
          ${{ steps.cargo-home.outputs.path }}/git/db/
          target/
          !target/debian/  # exclude built .deb packages to avoid stale binaries
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    # On bare runners, install a current stable Rust toolchain with components
    - name: Install Rust toolchain
      if: inputs.container-image == ''
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    # On bare runners, install just (command runner)
    - name: Install just
      if: inputs.container-image == ''
      uses: taiki-e/install-action@v2
      with:
        tool: just