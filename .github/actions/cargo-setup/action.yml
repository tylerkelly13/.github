name: Cargo Setup
description: Checks out the repository and caches Cargo dependencies

runs:
  using: "composite"
  steps:
    - name: Check out repository
      uses: actions/checkout@v6
    # CARGO_HOME may differ inside containers vs standard runners
    - name: Resolve Cargo home
      id: cargo-home
      run: echo "path=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache Cargo dependencies
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.cargo-home.outputs.path }}/registry/index/
          ${{ steps.cargo-home.outputs.path }}/registry/cache/
          ${{ steps.cargo-home.outputs.path }}/git/db/
          target/
          !target/debian/  # exclude built .deb packages to avoid stale binaries
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}