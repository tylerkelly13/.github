name: Notify on TypeScript 7 support
description: >-
  Posts a PR comment when typescript-eslint's peer range for `typescript`
  starts allowing TypeScript 7.x.

inputs:
  result:
    description: JSON payload from ts7-support-check (`range` and `supported` fields)
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/github-script@v7
      env:
        TS7_RESULT: ${{ inputs.result }}
        NOTIFY_SCRIPT_PATH: ${{ github.action_path }}/notify-ts7-support.js
      with:
        script: |
          const script = require(process.env.NOTIFY_SCRIPT_PATH);
          return await script({ github, context });
