on:
  workflow_call:
    inputs:
      enabled:
        description: Whether to run coverage
        required: true
        type: boolean
      container-image:
        description: Docker image to run the job in
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  Coverage:
    # allows callers to skip coverage report
    if: ${{ inputs.enabled }}
    runs-on: ubuntu-latest
    container: ${{ inputs.container-image || '' }}
    steps:
      - uses: tylerkelly13/.github/.github/actions/cargo-setup@main
      - name: Report test coverage
        run: just coverage
