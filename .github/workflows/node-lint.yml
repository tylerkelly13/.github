on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  Linting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: tylerkelly13/.github/.github/actions/node-setup@8d7d2e6616254a836736b88f3eb078caf96716db  # node-setup-civ1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Lint code
        run: pnpm lint

      - name: Check for TypeScript 7 support in typescript-eslint
        id: ts7-check
        if: always()
        run: |
          RESULT=$(node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire(import.meta.url);
            let range = "";
            try {
              range = require("@typescript-eslint/typescript-estree/package.json").peerDependencies?.typescript ?? "";
            } catch {
              process.exit(0);
            }
            // crude but sufficient: an explicit upper bound at or below 7 means TS7 is still blocked
            const upperBounds = [...range.matchAll(/<\s*(\d+)/g)].map((m) => Number(m[1]));
            const blocksTs7 = upperBounds.length > 0 && upperBounds.every((major) => major <= 7);
            console.log(JSON.stringify({ range, supported: !blocksTs7 }));
          ')
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "$RESULT"

      - name: Notify on TypeScript 7 support
        if: github.event_name == 'pull_request' && fromJson(steps.ts7-check.outputs.result || '{"supported":false}').supported == true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ts7-eslint-support-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            if (comments.some((c) => c.body.includes(marker))) return;
            const info = ${{ steps.ts7-check.outputs.result }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `${marker}\n@tylerkelly13 heads up: \`@typescript-eslint/typescript-estree\`'s peerDependencies.typescript is now \`${info.range}\`, which appears to allow TypeScript 7.x. The typescript pin (added for typescript-eslint/typescript-eslint#12518) may be safe to remove — worth a quick check before unpinning.`,
            });
