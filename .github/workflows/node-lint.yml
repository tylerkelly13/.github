on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  Linting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: tylerkelly13/.github/.github/actions/node-setup@8d7d2e6616254a836736b88f3eb078caf96716db  # node-setup-civ1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Lint code
        run: pnpm lint

      - name: Check for TypeScript 7 support in typescript-eslint
        id: ts7-check
        if: always()
        uses: tylerkelly13/.github/.github/actions/ts7-support-check@dcd2aea444b5c15f8b815200d2707897406b1b1b  # ts7-support-check-v1

      - name: Notify on TypeScript 7 support
        if: github.event_name == 'pull_request' && fromJson(steps.ts7-check.outputs.result || '{"supported":false}').supported == true
        uses: tylerkelly13/.github/.github/actions/notify-ts7-support@c328af90d2353287487e709149ca4cbd5775eb4c  # notify-ts7-support-v1
        with:
          result: ${{ steps.ts7-check.outputs.result }}
