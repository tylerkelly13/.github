name: Deploy

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: true


jobs:
  Build:
    uses: ./nodejs-build.yml
    with:
      node-version: ${{ inputs.node-version }}
  
  Linting:
    uses: ./nodejs-linting.yml
    with:
      node-version: ${{ inputs.node-version }}

  Formatting:
    uses: ./nodejs-formatting.yml
    with:
      node-version: ${{ inputs.node-version }}

  Tests:
    uses: ./nodejs-tests.yml
    with:
      node-version: ${{ inputs.node-version }}

  Release:
    needs: [ Build, Linting, Formatting, Tests ]
    uses: ./release.yml
