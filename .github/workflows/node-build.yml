on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
    outputs:
      artifact-id:
        description: The ID of the uploaded artifact
        value: ${{ jobs.Build.outputs.artifact-id }}

permissions:
  contents: read
  actions: write  # required by actions/upload-artifact

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - uses: tylerkelly13/.github/.github/actions/node-setup@8d7d2e6616254a836736b88f3eb078caf96716db  # node-setup-civ1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
      - name: Build package
        run: pnpm build
      - name: Generate Package
        run: pnpm pack --pack-destination artifacts
      - name: Generate checksums
        run: |
          mkdir -p artifacts/checksums
          sha256sum artifacts/*.tgz > artifacts/checksums/sha256.txt
      - name: Upload artifacts
        id: artifact-upload-step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: artifacts
          if-no-files-found: error
