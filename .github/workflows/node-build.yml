on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
    outputs:
      artifact-id:
        description: The ID of the uploaded artifact
        value: ${{ jobs.Build.outputs.artifact-id }}

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - uses: tylerkelly13/.github/.github/actions/node-setup@main
        with: 
          node-version: ${{ inputs.node-version }}
      - name: Build package
        run: pnpm build
      - name: Generate Package
        run: pnpm pack --pack-destination dist
      - name: Generate checksums
        run: shasum -a 256 dist/*.tgz > dist/checksums/sha256.txt
      - name: Upload artifacts
        id: artifact-upload-step
        uses: actions/upload-artifact@v3
        with:
          path: dist
          if-no-files-found: error
