on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
    outputs:
      artifact-id:
        description: The ID of the uploaded artifact
        value: ${{ jobs.Build.outputs.artifact-id }}

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - uses: tylerkelly13/.github/.github/actions/node-setup@main
        with: 
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
      - name: Build package
        run: pnpm build
      - name: Generate Package
        run: pnpm pack --pack-destination artifacts
      - name: Generate checksums
        run: |
          mkdir -p artifacts/checksums
          shasum -a 256 artifacts/*.tgz > artifacts/checksums/sha256.txt
      - name: Upload artifacts
        id: artifact-upload-step
        uses: actions/upload-artifact@v6
        with:
          path: artifacts
          if-no-files-found: error
