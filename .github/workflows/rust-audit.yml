on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: Whether findings fail the job (false reports them without failing)
        required: false
        default: false
        type: boolean
      container-image:
        description: Docker image to run the job in
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  Audit:
    runs-on: ubuntu-latest
    container: ${{ inputs.container-image || '' }}
    steps:
      # Not cargo-setup: its cache step saves target/ under the shared Cargo.lock key, and this job
      # never builds, so it could save an empty target/ before the build job does.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      # On bare runners, install cargo-deny; container images ship it pre-installed
      - name: Install cargo-deny
        if: inputs.container-image == ''
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5  # v2
        with:
          tool: cargo-deny
      # Without a deny.toml, cargo-deny allows no licenses and fails every crate, so repos without
      # one get the advisory check only.
      - name: Check dependencies
        continue-on-error: ${{ !inputs.fail-on-findings }}
        run: |
          if [ -f deny.toml ]; then
            cargo deny check
          else
            cargo deny check advisories
          fi
