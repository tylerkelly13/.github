name: Deploy

on:
  workflow_call:
    outputs:
      artifact-id:
        description: The ID of the uploaded build artifact
        value: ${{ jobs.Build.outputs.artifact-id }}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  Build:
    uses: tylerkelly13/.github/.github/workflows/rust-build.yml@main
  
  Linting:
    uses: tylerkelly13/.github/.github/workflows/rust-lint.yml@main

  Formatting:
    uses: tylerkelly13/.github/.github/workflows/rust-formatting.yml@main

  Tests:
    uses: tylerkelly13/.github/.github/workflows/rust-test.yml@main

