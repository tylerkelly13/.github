name: Deploy

on:
  workflow_call:
    inputs:
      coverage:
        description: Whether to run coverage
        required: false
        default: false
        type: boolean
      container-image:
        description: Docker image to run jobs in
        required: false
        default: ''
        type: string
    outputs:
      artifact-id:
        description: The ID of the uploaded build artifact
        value: ${{ jobs.Build.outputs.artifact-id }}

permissions:
  contents: read
  actions: write  # inherited by rust-build.yml for artifact upload

concurrency:
  group: checks-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Build:
    uses: ./.github/workflows/rust-build.yml
    with:
      container-image: ${{ inputs.container-image }}

  Linting:
    uses: ./.github/workflows/rust-lint.yml
    with:
      container-image: ${{ inputs.container-image }}

  Formatting:
    uses: ./.github/workflows/rust-formatting.yml
    with:
      container-image: ${{ inputs.container-image }}

  Tests:
    uses: ./.github/workflows/rust-test.yml
    with:
      container-image: ${{ inputs.container-image }}

  Coverage:
    uses: ./.github/workflows/rust-coverage.yml
    with:
      enabled: ${{ inputs.coverage }}
      container-image: ${{ inputs.container-image }}
