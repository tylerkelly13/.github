on:
  workflow_call:
    inputs:
      artifact-id:
        required: true
        type: string

jobs:
  Release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: target/debian

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            target/debian/*.deb
            target/debian/checksums/*.txt
          draft: true
          generate_release_notes: true