name: Deploy

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: true


jobs:
  Build:
    uses: tylerkelly13/.github/.github/workflows/nodejs-build.yml@main
    with:
      node-version: ${{ inputs.node-version }}
  
  Linting:
    uses: tylerkelly13/.github/.github/workflows/nodejs-linting.yml@main
    with:
      node-version: ${{ inputs.node-version }}

  Formatting:
    uses: tylerkelly13/.github/.github/workflows/nodejs-formatting.yml@main
    with:
      node-version: ${{ inputs.node-version }}

  Tests:
    uses: tylerkelly13/.github/.github/workflows/nodejs-tests.yml@main
    with:
      node-version: ${{ inputs.node-version }}

  Release:
    needs: [ Build, Linting, Formatting, Tests ]
    uses: tylerkelly13/.github/.github/workflows/release.yml@main
