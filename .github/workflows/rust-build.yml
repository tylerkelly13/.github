on:
  workflow_call:
    inputs:
      container-image:
        description: Docker image to run the job in
        required: false
        default: ''
        type: string
    outputs:
      artifact-id:
        description: The ID of the uploaded artifact
        value: ${{ jobs.Build.outputs.artifact-id }}

permissions:
  contents: read
  actions: write  # required by actions/upload-artifact

jobs:
  Build:
    runs-on: ubuntu-latest
    container: ${{ inputs.container-image || '' }}
    outputs:
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - uses: tylerkelly13/.github/.github/actions/cargo-setup@8d7d2e6616254a836736b88f3eb078caf96716db  # cargo-setup-civ1
        with:
          container-image: ${{ inputs.container-image }}
      # On bare runners, install cargo-deb for Debian packaging
      - name: Install cargo-deb
        if: inputs.container-image == ''
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5  # v2
        with:
          tool: cargo-deb
      - name: Build project
        run: just build
      - name: Generate Package
        run: just deb
      - name: Generate checksums
        run: |
          mkdir -p target/debian/checksums
          sha256sum target/debian/*.deb > target/debian/checksums/sha256.txt
      - name: Upload artifacts
        id: artifact-upload-step
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          path: target/debian
          if-no-files-found: error
