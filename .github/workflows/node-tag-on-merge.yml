name: Node.js tag on merge

on:
  workflow_call:

permissions: {}

jobs:
  Tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the version tag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate version from branch name
        id: ver
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#bump-}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: head ref '$HEAD_REF' did not yield a valid version tag" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists on origin
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Error: tag $TAG already exists" >&2
            exit 1
          fi

      - name: Configure git as github-actions[bot]
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create and push annotated tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git tag -a "$TAG" -m "$TAG" "$MERGE_SHA"
          git push origin "$TAG"
