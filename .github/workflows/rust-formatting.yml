on:
  workflow_call:
    inputs:
      container-image:
        description: Docker image to run the job in
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  Formatting:
    runs-on: ubuntu-latest
    container: ${{ inputs.container-image || '' }}
    steps:
      - uses: tylerkelly13/.github/.github/actions/cargo-setup@8d7d2e6616254a836736b88f3eb078caf96716db  # cargo-setup-civ1
        with:
          container-image: ${{ inputs.container-image }}
      - name: Check code formatting
        run: just fmt-check
